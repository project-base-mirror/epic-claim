services:
  epic-claim:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Optional API token for scripts (>= 32 chars). People log in with username/password.
      EPIC_ADMIN_TOKEN: "${EPIC_ADMIN_TOKEN:-}"
      # Required: AES-256-GCM key for stored Epic credentials. Generate with: openssl rand -base64 32
      EPIC_SECRET_KEY: "${EPIC_SECRET_KEY:?Set EPIC_SECRET_KEY in .env (openssl rand -base64 32)}"
      EPIC_PROFILE_ROOT: /data/profiles
      # Manual-login browser network/locale. EPIC_BROWSER_PROXY: direct (default) | env = use HTTP(S)_PROXY | http(s)/socks5 URL,
      # "direct" = no proxy, or a proxy URL. Keep timezone/lang consistent with the exit IP.
      EPIC_BROWSER_PROXY: "${EPIC_BROWSER_PROXY:-direct}"
      EPIC_BROWSER_TZ: "${EPIC_BROWSER_TZ:-Asia/Shanghai}"
      EPIC_BROWSER_LANG: "${EPIC_BROWSER_LANG:-zh-CN}"
    volumes:
      - ./config.docker.yaml:/app/config.yaml:ro
      - epic-data:/data
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  epic-data:
