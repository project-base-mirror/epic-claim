services:
  epic-claim:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      EPIC_ADMIN_TOKEN: "${EPIC_ADMIN_TOKEN:?Set a private admin token of at least 32 characters}"
      EPIC_PROFILE_ROOT: /data/profiles
    volumes:
      - ./config.docker.yaml:/app/config.yaml:ro
      - epic-data:/data
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  epic-data:
