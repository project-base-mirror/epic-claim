services:
  epic-claim:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      # - EPIC_CLAIM_MASTER_KEY=change-me
    depends_on:
      - worker

  # Placeholder claimer worker (browser login / hCaptcha / checkout).
  # TODO: replace with epic-freebies-helper, epicgames-freegames-node, or own Playwright worker.
  worker:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    restart: unless-stopped
