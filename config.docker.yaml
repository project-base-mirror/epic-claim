listen: ":8080"
database: "/data/epic-claim.db"
locale: "en-US"
country: "US"
epic_endpoint: "https://store-site-backend-static-ipv4.ak.epicgames.com/freeGamesPromotions"
schedule:
  check_interval: "1h"
  account_delay: "5s"
claimer:
  type: "exec"
  command: ["node", "/app/workers/epic/worker.mjs"]
  timeout: "5m"
# First registered web user becomes admin; afterwards registration stays closed
# unless enabled here or by an admin in the web UI.
allow_registration: false
login:
  # Headed Chromium on a private Xvfb display so the user can solve challenges in the live view.
  command: ["xvfb-run", "-a", "--server-args=-screen 0 1280x960x24 -nolisten tcp", "node", "/app/workers/epic/login-headless.mjs"]
  timeout: "15m"
